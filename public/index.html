<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iBake — Order Cakes Online</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<nav>
  <div class="logo">i<span>Bake</span></div>
  <button class="cart-btn" onclick="openCart()">
    🛒 Cart <span class="cart-count" id="cartCount">0</span>
  </button>
</nav>

<div class="hero">
  <h1>Cakes made for the moment.</h1>
  <p>Browse our cakes below, or ask us to design something custom just for you.</p>
</div>

<div class="custom-cta">
  <div class="custom-card">
    <div class="txt">
      <h3>🎂 Make a Custom Cake</h3>
      <p>Tell us your theme, flavour and date — we'll take it from there.</p>
    </div>
    <a class="go-btn" id="customCakeLink" href="#" target="_blank">💬 Chat on WhatsApp</a>
  </div>
</div>

<div class="cat-tabs" id="catTabs"></div>

<div class="menu-section" id="menuSection">
  <p style="text-align:center; color:var(--ink-soft); padding: 40px 0;">Loading menu…</p>
</div>

<!-- Cart Drawer -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-head">
    <h3>Your Cart</h3>
    <button onclick="closeCart()">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer" id="cartFooter" style="display:none;">
    <div class="cart-total-row"><span>Total</span><span id="cartTotal">₹0</span></div>
    <div class="cart-actions">
      <button class="btn btn-pay" onclick="goToCheckout()">Pay Now →</button>
      <button class="btn btn-whatsapp" id="enquireBtn">💬 Enquire on WhatsApp</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
